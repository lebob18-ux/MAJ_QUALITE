<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MAJ_PCLE-MMM</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--tx:#1a232c;--mu:#6b7884;--ln:#d9dee2;--sl:#dde2e6;--ok:#2f8f63;--ec:#e08a1e;--sx:#2f6f9f;--dep:#c4543b}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--card:#1a2530;--tx:#e8edf1;--mu:#8fa0ad;--ln:#2b3946;--sl:#2f3d4a;--ok:#4cb485;--ec:#f0a23a;--sx:#5aa0d2;--dep:#e0705a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;padding:0 0 env(safe-area-inset-bottom,0px)}
main{max-width:760px;margin:0 auto;padding:0 12px 40px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 6px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu);font-size:12px}
button,input,select{font:inherit;color:var(--tx);border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:8px 12px;min-height:42px}
select,input[type=text],input[type=search]{width:100%}
.seg{display:flex;gap:4px;background:var(--sl);padding:3px;border-radius:10px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;min-height:38px;font-size:14px;padding:4px}
.seg button[aria-pressed=true]{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.rl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:12px;border-radius:6px;background:var(--sl);overflow:hidden;display:flex;margin:6px 0}
.bar i{display:block;height:100%}
.ln{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,.8fr);gap:8px;align-items:center;margin-top:6px}
.tg{display:flex;align-items:center;gap:8px;min-height:36px}
.tg input{width:20px;height:20px;min-height:0;margin:0}
.ln input[type=date]{min-height:36px;padding:4px 6px;width:100%}
.tag{border:1px solid var(--ln);border-radius:6px;padding:1px 6px;font-size:11px;margin-right:4px}
.btn{width:100%;font-weight:600}
.del{min-height:32px;padding:2px 10px}
.frm{display:grid;gap:6px}
:focus-visible{outline:2px solid var(--sx);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="top">
<header><div><h1>MAJ_PCLE-MMM</h1><div class="mu" id="st"></div></div>
<span style="display:flex;gap:6px"><button id="adm" type="button" style="font-weight:600">🔐 Admin</button><button id="inst" type="button" style="display:none;font-weight:600">📲 Installer</button><button id="rf" type="button">Actualiser</button></span></header>
</div>
<div id="v"></div>
</main>
<script>
window.addEventListener('error', e => alert('Erreur JS : ' + e.message + ' (ligne ' + e.lineno + ')'));
const U = "https://thbqkeugjvsxbryfnzuo.supabase.co";
const K = "sb_publishable_2-Ij-nrTPeK6rB-kSD-QTg_b42zNakq";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = s => String(s || '').trim().toUpperCase();
const nz = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const H = {apikey:K, 'Content-Type':'application/json', Prefer:'return=representation'};
const EXC = ['TEST_BOB'];
const LB = {FKT:['FKT reçue · à analyser', 'FKT analysée · amortie'], FA:['Éditée', 'Amortie'], PA:['Éditée', 'Levée']};
const jour = () => { const d = new Date(); if(d.getHours() < 6) d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
let ADM = null, D = {sx:[], bl:[], q:[], names:{}}, cur = localStorage.getItem('maj_ch') || '', cat = 'FKT', flt = '', ft = '';
const FKT_ORD = ['FKT_AT', 'FKT_ARMEMENT', 'FKT_FBM', 'FKT_DEROULAGE'];
const ftLabel = t => String(t).replace(/^FKT_/, '').replace(/_/g, ' ');

async function all(t, c){
  let out = [], from = 0;
  for(;;){
    const r = await fetch(`${U}/rest/v1/${t}?select=${c}&order=id.asc`, {headers:{apikey:K, 'Range-Unit':'items', Range:`${from}-${from+999}`}});
    if(!r.ok) throw new Error(`${t} : erreur ${r.status}`);
    const a = await r.json(); out = out.concat(a);
    if(a.length < 1000) break; from += 1000;
  }
  return out;
}
async function verif(email){
  try{
    const r = await fetch(`${U}/rest/v1/app_bob?email=eq.${encodeURIComponent(email)}&select=nom,prenom,admin`, {headers:{apikey:K}});
    if(!r.ok) return null;
    const a = await r.json();
    return a[0] && a[0].admin === true ? {email, prenom:a[0].prenom || '', nom:a[0].nom || ''} : null;
  }catch(e){ return null; }
}
async function login(){
  if(ADM){ if(confirm('Se déconnecter ?')){ ADM = null; localStorage.removeItem('maj_adm'); majUI(); draw(); } return; }
  const email = (prompt('Email administrateur :', localStorage.getItem('maj_adm') || '') || '').trim().toLowerCase();
  if(!email) return;
  const a = await verif(email);
  if(!a){ alert("Accès refusé : cet email n’est pas administrateur."); return; }
  ADM = a; localStorage.setItem('maj_adm', email); majUI(); load();
}
const majUI = () => { $('#adm').textContent = ADM ? '🔓 ' + (ADM.prenom || 'Admin') : '🔐 Admin'; };

async function load(){
  if(!ADM){ draw(); return; }
  $('#st').textContent = 'Chargement…';
  try{
    const [sx, bl, q] = await Promise.all([
      all('suivi_sutx_v2', 'id,Chantier,Support,Tache,type'),
      all('blindage', 'id,chantier,support'),
      all('qualite_pcle', 'id,chantier,support,fkt_type,fkt_edit,fkt_amorti,categorie,numero,libelle,origine')
    ]);
    D = {sx, bl, q, names:{}};
    const nm = n => { const k = key(n); if(k && !EXC.includes(k) && !D.names[k]) D.names[k] = String(n).trim(); };
    sx.forEach(r => nm(r.Chantier)); bl.forEach(r => nm(r.chantier)); q.forEach(r => nm(r.chantier));
    $('#st').textContent = 'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    draw();
  }catch(e){
    $('#st').textContent = 'Erreur de chargement';
    $('#v').innerHTML = `<div class="card">Lecture impossible : ${esc(e.message)}<div class="mu">Vérifie que les colonnes categorie, numero, libelle et origine existent dans qualite_pcle (script SQL).</div></div>`;
  }
}

const rows = (c, ck) => D.q.filter(x => (x.categorie || 'FKT') === c && key(x.chantier) === ck)
  .sort((a, b) => c === 'FKT' ? String(a.support).localeCompare(String(b.support), 'fr', {numeric:true}) || FKT_ORD.indexOf(a.fkt_type) - FKT_ORD.indexOf(b.fkt_type) : String(a.numero || a.support || '').localeCompare(String(b.numero || b.support || ''), 'fr', {numeric:true}));

/* PA obligatoires : une par fouille, une par FKT appareil tendeur */
/* PA obligatoires : une par fouille, une par FKT appareil tendeur */
function req(ck){
  const o = [];
  D.bl.filter(b => key(b.chantier) === ck).forEach(b => o.push({origine:'FOUILLE', support:b.support, libelle:null}));
  D.sx.filter(r => key(r.Chantier) === ck).forEach(r => {
    const t = nz(r.Tache), ty = key(r.type);
    if(ty === 'GC' && t.includes('fouille')) {
      o.push({origine:'FOUILLE', support:r.Support, libelle:null});
    }
  });
  D.q.filter(x => (x.categorie || 'FKT') === 'FKT' && key(x.chantier) === ck && key(x.fkt_type) === 'FKT_AT').forEach(x => {
    o.push({origine:'FKT_AT', support:x.support, libelle:'PA FKT_AT'});
  });
  const ex = rows('PA', ck).filter(x => x.origine);
  return o.filter((x, i) => o.findIndex(y => y.origine === x.origine && key(y.support) === key(x.support) && y.libelle === x.libelle) === i)
    .filter(x => !ex.some(e => e.origine === x.origine && key(e.support) === key(x.support)));
}

function row(x){
  const c = x.categorie || 'FKT', l = LB[c];
  const ln = (f, t) => `<label class="tg" style="margin-top:6px"><input type="checkbox" data-f="${f}" data-id="${x.id}"${x[f] ? ' checked' : ''}> ${t}</label>`;
  const titre = c === 'FKT' ? `Support ${esc(x.support)}` : (x.numero ? esc(x.numero) : `<input type="text" data-n="${x.id}" placeholder="N° ${c}" style="width:110px;min-height:36px">`) + (x.support ? ' · Support ' + esc(x.support) : '');
  const sub = c === 'FKT' ? esc(x.fkt_type) : (x.origine === 'FOUILLE' ? '<span class="tag">Fouille</span>' : x.origine === 'FKT_AT' ? '<span class="tag">FKT appareil tendeur</span>' : '') + (x.origine === 'FOUILLE' ? '' : esc(x.libelle || ''));
  return `<div class="card"><div class="rl"><b>${titre}</b>${c === 'FKT' ? '' : `<button type="button" class="del" data-del="${x.id}">🗑</button>`}</div>${sub ? `<div class="mu">${sub}</div>` : ''}${ln('fkt_edit', l[0])}${ln('fkt_amorti', l[1])}</div>`;
}

function draw(){
  if(!ADM){ $('#v').innerHTML = '<div class="card">Connexion administrateur requise pour mettre à jour.<button type="button" class="btn" id="lg" style="margin-top:10px">🔐 Connexion</button></div>'; $('#lg').onclick = login; return; }
  const ks = Object.keys(D.names).sort((a, b) => D.names[a].localeCompare(D.names[b], 'fr'));
  if(!ks.includes(cur)) cur = ks[0] || '';
  $('#v').innerHTML = `<select id="ch">${ks.map(k => `<option value="${esc(k)}"${k === cur ? ' selected' : ''}>${esc(D.names[k])}</option>`).join('')}</select>
    <div class="seg">${['FKT', 'PA', 'FA'].map(c => `<button type="button" data-c="${c}" aria-pressed="${c === cat}">${c}</button>`).join('')}</div>
    <div id="sub"></div>
    <input type="search" id="q" placeholder="Filtrer (support, N°, libellé)" value="${esc(flt)}" style="margin-bottom:10px">
    <div id="sum"></div><div id="lst"></div>
    ${cat === 'FKT' ? '' : `<div class="card"><h2>Créer une ${cat}</h2><div class="frm"><input type="text" id="fn" placeholder="N° (ex. 12)"><input type="text" id="fs" placeholder="Support (facultatif)"><input type="text" id="fl" placeholder="Libellé (facultatif)"><button type="button" class="btn" data-add>➕ Créer la ${cat}</button></div></div>`}`;
  drawList();
}
function drawList(){
  const A = rows(cat, cur), lb = LB[cat], R = cat === 'PA' ? req(cur) : [];
  const types = cat === 'FKT' ? [...new Set(A.map(x => x.fkt_type).filter(Boolean))].sort((a, b) => (FKT_ORD.indexOf(a) + 1 || 99) - (FKT_ORD.indexOf(b) + 1 || 99)) : [];
  if(!types.includes(ft)) ft = '';
  const L = cat === 'FKT' && ft ? A.filter(x => x.fkt_type === ft) : A;
  const n = L.length, e = L.filter(x => x.fkt_edit).length, c = L.filter(x => x.fkt_amorti).length;
  if($('#sub')) $('#sub').innerHTML = types.length ? `<div class="seg" style="flex-wrap:wrap"><button type="button" style="flex:1 1 auto" data-ft="" aria-pressed="${ft === ''}">Tous</button>${types.map(t => `<button type="button" style="flex:1 1 auto" data-ft="${esc(t)}" aria-pressed="${ft === t}">${esc(ftLabel(t))}</button>`).join('')}</div>` : '';
  const q = nz(flt), S = L.filter(x => !q || nz([x.support, x.numero, x.libelle, x.fkt_type].join(' ')).includes(q));
  $('#sum').innerHTML = `<div class="card"><div class="rl"><b>${cat}${ft ? ' ' + esc(ftLabel(ft)) : ''} · ${esc(D.names[cur] || '')}</b><b>${c} / ${n} · ${n ? Math.round(c / n * 100) : 0} %</b></div>
    <div class="bar"><i style="width:${n ? c / n * 100 : 0}%;background:var(--ok)"></i><i style="width:${n ? (e - c) / n * 100 : 0}%;background:var(--ec)"></i></div>
    <div class="mu"><span style="color:var(--ok)">■</span> ${lb[1]} (${c}) · <span style="color:var(--ec)">■</span> ${lb[0]} (${e - c}) · à faire (${n - e})</div>
    ${R.length ? `<button type="button" class="btn" data-gen style="margin-top:10px">⚠️ Créer les ${R.length} PA obligatoires manquantes</button><div class="mu">Fouilles et FKT appareil tendeur sans PA.</div>` : ''}</div>`;
  $('#lst').innerHTML = S.map(row).join('') || '<div class="card mu">Aucune ligne.</div>';
}

async function patch(id, p){
  const x = D.q.find(z => String(z.id) === String(id));
  try{
    const r = await fetch(`${U}/rest/v1/qualite_pcle?id=eq.${id}`, {method:'PATCH', headers:H, body:JSON.stringify(p)});
    if(!r.ok) throw new Error('erreur ' + r.status + ' (droit UPDATE / RLS ?)');
    const a = await r.json();
    if(!a.length) throw new Error('aucune ligne modifiée (RLS)');
    Object.assign(x, a[0]);
  }catch(e){ alert('Enregistrement impossible : ' + e.message); }
  drawList();
}
async function post(body){
  const r = await fetch(`${U}/rest/v1/qualite_pcle`, {method:'POST', headers:H, body:JSON.stringify(body)});
  if(!r.ok) throw new Error('erreur ' + r.status + ' (droit INSERT ou colonnes manquantes ?)');
  D.q.push(...await r.json());
}

$('#v').addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'ch'){ cur = el.value; localStorage.setItem('maj_ch', cur); drawList(); return; }
  if(!ADM) return;
  if(el.dataset.f){
    const f = el.dataset.f, x = D.q.find(z => String(z.id) === el.dataset.id), p = {};
    p[f] = el.checked ? jour() : null;
    if(f === 'fkt_amorti' && el.checked && x && !x.fkt_edit) p.fkt_edit = jour();
    if(f === 'fkt_edit' && !el.checked) p.fkt_amorti = null;
    patch(el.dataset.id, p);
  } else if(el.dataset.d){ if(el.value) patch(el.dataset.id, {[el.dataset.d]:el.value}); }
  else if(el.dataset.n && el.value.trim()) patch(el.dataset.n, {numero:el.value.trim()});
});
$('#v').addEventListener('input', e => { if(e.target.id === 'q'){ flt = e.target.value; drawList(); } });
$('#v').addEventListener('click', async e => {
  const t = e.target.closest('button'); if(!t || !ADM) return;
  if(t.dataset.c){ cat = t.dataset.c; draw(); return; }
  if(t.dataset.ft !== undefined){ ft = t.dataset.ft; drawList(); return; }
  try{
    if('gen' in t.dataset){ await post(req(cur).map(o => ({chantier:D.names[cur], categorie:'PA', numero:null, ...o}))); }
    else if('add' in t.dataset){
      const g = i => $('#' + i).value.trim();
      if(!g('fn')){ alert('Indique un numéro.'); return; }
      await post([{chantier:D.names[cur], categorie:cat, numero:g('fn'), support:g('fs') || null, libelle:g('fl') || null}]);
      ['fn', 'fs', 'fl'].forEach(i => $('#' + i).value = '');
    } else if(t.dataset.del){
      if(!confirm('Supprimer cette ligne ?')) return;
      const r = await fetch(`${U}/rest/v1/qualite_pcle?id=eq.${t.dataset.del}`, {method:'DELETE', headers:{apikey:K}});
      if(!r.ok) throw new Error('erreur ' + r.status + ' (droit DELETE ?)');
      D.q = D.q.filter(x => String(x.id) !== t.dataset.del);
    } else return;
  }catch(err){ alert('Action impossible : ' + err.message); }
  drawList();
});

$('#adm').addEventListener('click', login);
$('#rf').addEventListener('click', load);
document.addEventListener('visibilitychange', () => { if(!document.hidden && ADM && !document.activeElement.closest('#v')) load(); });
{ const m = localStorage.getItem('maj_adm'); if(m) verif(m).then(a => { ADM = a; majUI(); load(); }); else draw(); }

/* Installation (PC / Android) + service worker */
let inv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); inv = e; $('#inst').style.display = ''; });
window.addEventListener('appinstalled', () => { inv = null; $('#inst').style.display = 'none'; });
$('#inst').addEventListener('click', async () => { if(!inv) return; inv.prompt(); await inv.userChoice; inv = null; $('#inst').style.display = 'none'; });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
